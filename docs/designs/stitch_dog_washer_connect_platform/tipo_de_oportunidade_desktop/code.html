<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden">
<!-- Header Navigation Shell -->

<div class="flex items-center gap-8">
<div class="flex items-center gap-2">

<span class="font-display text-headline-lg font-bold text-on-primary">PetConnect</span>
</div>
<nav class="hidden md:flex gap-6 items-center">
<a class="font-label-md text-label-md text-secondary-container border-b-2 border-secondary-container pb-1 transition-colors" href="#">Opportunities</a>
<a class="font-label-md text-label-md text-on-primary/80 hover:text-secondary-container transition-colors" href="#">My Units</a>
<a class="font-label-md text-label-md text-on-primary/80 hover:text-secondary-container transition-colors" href="#">Professionals</a>
<a class="font-label-md text-label-md text-on-primary/80 hover:text-secondary-container transition-colors" href="#">Payments</a>
</nav>
</div>
<div class="flex items-center gap-4">
<button class="bg-secondary-container text-on-secondary-container px-6 py-2 rounded-lg font-label-md hover:opacity-90 active:scale-95 duration-100 transition-all">
                Create Opportunity
            </button>
<div class="flex items-center gap-2 text-on-primary">
<span class="material-symbols-outlined cursor-pointer hover:text-secondary-container">notifications</span>
<span class="material-symbols-outlined cursor-pointer hover:text-secondary-container">account_circle</span>
</div>
</div>
</header>
<main class="max-w-container-max mx-auto px-margin-desktop py-12">
<!-- Page Header -->
<div class="mb-12 text-center">
<h1 class="font-display text-display text-on-surface mb-4">Que tipo de apoio sua operação precisa?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">
                Selecione a modalidade de contratação que melhor atende à sua demanda atual. Oferecemos flexibilidade para garantir que sua unidade nunca fique sem suporte profissional.
            </p>
</div>
<!-- Opportunity Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter">
<!-- Diária Completa -->
<button class="opportunity-card group bg-surface-container-lowest border border-outline-variant p-6 rounded-xl text-left transition-all duration-300 flex flex-col items-start gap-4 h-full" onclick="selectType(this)">
<div class="w-12 h-12 rounded-lg bg-tertiary-fixed flex items-center justify-center text-[#008080]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
</div>
<div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-1">Diária Completa</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Ideal para reforço operacional em dias de fluxo intenso garantindo produtividade total por 8h.</p>
</div>
</button>
<!-- Meio Período -->
<button class="opportunity-card group bg-surface-container-lowest border border-outline-variant p-6 rounded-xl text-left transition-all duration-300 flex flex-col items-start gap-4 h-full" onclick="selectType(this)">
<div class="w-12 h-12 rounded-lg bg-tertiary-fixed flex items-center justify-center text-[#008080]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">schedule</span>
</div>
<div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-1">Meio Período</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Suporte de 4h focado em turnos específicos de manhã ou tarde conforme sua necessidade.</p>
</div>
</button>
<!-- Por Hora -->
<button class="opportunity-card group bg-surface-container-lowest border border-outline-variant p-6 rounded-xl text-left transition-all duration-300 flex flex-col items-start gap-4 h-full" onclick="selectType(this)">
<div class="w-12 h-12 rounded-lg bg-tertiary-fixed flex items-center justify-center text-[#008080]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">timer</span>
</div>
<div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-1">Por Hora</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Máxima flexibilidade para cobrir picos de atendimento ou tarefas pontuais em horários variados.</p>
</div>
</button>
<!-- Cobertura de Falta -->
<button class="opportunity-card group bg-surface-container-lowest border border-outline-variant p-6 rounded-xl text-left transition-all duration-300 flex flex-col items-start gap-4 h-full" onclick="selectType(this)">
<div class="w-12 h-12 rounded-lg bg-tertiary-fixed flex items-center justify-center text-[#008080]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">emergency</span>
</div>
<div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-1">Cobertura de Falta</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Solicitação urgente para substituição de colaboradores ausentes, evitando interrupções na agenda.</p>
</div>
</button>
<!-- Reforço de Final de Semana -->
<button class="opportunity-card group bg-surface-container-lowest border border-outline-variant p-6 rounded-xl text-left transition-all duration-300 flex flex-col items-start gap-4 h-full" onclick="selectType(this)">
<div class="w-12 h-12 rounded-lg bg-tertiary-fixed flex items-center justify-center text-[#008080]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">weekend</span>
</div>
<div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-1">Reforço de Final de Semana</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Apoio extra para os dias mais movimentados da semana, garantindo excelência no atendimento pet.</p>
</div>
</button>
<!-- Personalizado -->
<button class="opportunity-card group bg-surface-container-lowest border border-outline-variant p-6 rounded-xl text-left transition-all duration-300 flex flex-col items-start gap-4 h-full" onclick="selectType(this)">
<div class="w-12 h-12 rounded-lg bg-tertiary-fixed flex items-center justify-center text-[#008080]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">add_circle</span>
</div>
<div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-1">Modalidade Customizada</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Precisa de algo diferente? Defina parâmetros específicos para sua nova oportunidade.</p>
</div>
</button>
</div>
<!-- Navigation Actions -->
<div class="mt-12 flex justify-between items-center bg-surface-container-low p-6 rounded-xl border border-outline-variant">
<button class="flex items-center gap-2 font-label-md text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
                Voltar para o Dashboard
            </button>
<div class="flex gap-4">
<button class="px-8 py-3 rounded-lg border border-primary font-label-md text-primary hover:bg-surface-container transition-colors">
                    Salvar Rascunho
                </button>
<button class="px-8 py-3 rounded-lg bg-primary text-on-primary font-label-md opacity-50 cursor-not-allowed hover:bg-primary/90 transition-all disabled:hover:opacity-50" disabled="" id="nextStep">
                    Continuar para Detalhes
                </button>
</div>
</div>
</main>
<!-- Side Decoration (Implicit Identity) -->
<div class="fixed left-0 top-1/2 -translate-y-1/2 opacity-5 pointer-events-none -ml-20">
<img alt="" class="w-80 h-auto grayscale" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDfFOZe-OV62hSdedg21wKz9zihyeX67vPLZskqqRqTw1y-hn0YuGNQdaGggPOol64RUifhLBDSZqeg2LZwcBksRWYbKCQmOwE1kdgqawH5ZYn_OJvGDdsKZJmub6H-yUwHOzHrMsY8uN4rJJgvLUd3V4-r9RdMf0nHKDFmtwTCce0euJH_9IT-UHV7nf4Q8xCClP2hQ6u1AG7sEoQjv3VmZ4_43IwWYPR8OD8Ap98pDQBQbmbvjCwEvrKSS3pHdeMnBA"/>
</div>
<script>
        function selectType(element) {
            // Remove active class from all cards
            document.querySelectorAll('.opportunity-card').forEach(card => {
                card.classList.remove('active');
            });
            
            // Add active class to clicked card
            element.classList.add('active');
            
            // Enable next button
            const nextBtn = document.getElementById('nextStep');
            nextBtn.disabled = false;
            nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            nextBtn.classList.add('active:scale-95');
        }

        // Simple enter interaction for cards
        document.querySelectorAll('.opportunity-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                if (!card.classList.contains('active')) {
                    card.style.transform = 'translateY(-4px)';
                }
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0)';
            });
        });
    </script>
</body></html>
