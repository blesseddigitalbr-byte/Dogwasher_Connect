<!-- Navigation suppression check: Since this is a task-focused flow (selecting opportunity type), global navigation is suppressed to focus on the journey. -->
<script>
        // Micro-interaction: Active state visual feedback for selection
        const cards = document.querySelectorAll('.option-card');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Clear active states
                cards.forEach(c => {
                    c.classList.remove('border-primary', 'bg-surface-container-high');
                    c.classList.add('border-outline-variant', 'bg-surface-container-lowest');
                });
                // Set current active
                card.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
                card.classList.add('border-primary', 'bg-surface-container-high');
            });
        });
    </script>
