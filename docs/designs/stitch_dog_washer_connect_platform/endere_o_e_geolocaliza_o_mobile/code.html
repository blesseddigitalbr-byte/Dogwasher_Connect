<script>
        // Simple micro-interaction for the pin button
        const pinBtn = document.querySelector('.group');
        if(pinBtn) {
            pinBtn.addEventListener('click', () => {
                const icon = pinBtn.querySelector('.material-symbols-outlined');
                icon.style.transform = 'translateY(-4px)';
                setTimeout(() => {
                    icon.style.transform = 'translateY(0)';
                }, 200);
            });
        }

        // Form focus styling simulation
        const inputs = document.querySelectorAll('input[type="text"]');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('shadow-md');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('shadow-md');
            });
        });
    </script>
