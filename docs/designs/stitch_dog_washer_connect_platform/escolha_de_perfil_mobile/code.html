<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8f9fa;

        }
        .hover-reveal-icon {
            transform: translateX(-10px);

        }
        .glass-card:hover .hover-reveal-icon {

<!-- Option: Hiring Professionals -->
<button class="glass-card flex flex-col items-start p-stack-lg rounded-xl border border-outline-variant text-left group">
<div class="w-16 h-16 rounded-lg bg-primary-container flex items-center justify-center mb-stack-md">

<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mousedown', () => {
                card.style.transform = 'scale(0.98) translateY(-4px)';
            });
            card.addEventListener('mouseup', () => {
                card.style.transform = 'scale(1) translateY(-8px)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = '';
            });
        });
    </script>
