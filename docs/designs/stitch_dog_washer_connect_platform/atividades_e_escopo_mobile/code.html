<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Atividades</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-center opacity-80">Selecione os serviços realizados e adicione observações.</p>
</header>
<!-- Main Content -->
<main class="px-margin-mobile flex flex-col gap-8">
<!-- Selection List Section -->
<section class="flex flex-col gap-stack-md">
<div class="flex justify-between items-end mb-2">
<h2 class="font-title-lg text-title-lg text-on-surface">Serviços</h2>
<span class="font-label-md text-label-md text-secondary">Selecione todos que se aplicam</span>
</div>
<div class="grid grid-cols-1 gap-3">
<!-- Activity Item -->
<button class="flex items-center justify-between p-4 rounded-xl glass-card transition-all duration-200 hover:shadow-md group" onclick="toggleService(this)">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:bg-secondary-fixed transition-colors">
<span class="material-symbols-outlined" data-icon="wash">wash</span>
</div>
<div class="text-left">
<span class="block font-title-lg text-title-lg leading-none">Banho Completo</span>
<span class="text-label-md text-on-surface-variant opacity-60">Higienização e secagem</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant select-icon" data-icon="check_circle">check_circle</span>
</button>
<!-- Activity Item -->
<button class="flex items-center justify-between p-4 rounded-xl glass-card transition-all duration-200 hover:shadow-md group" onclick="toggleService(this)">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:bg-secondary-fixed transition-colors">
<span class="material-symbols-outlined" data-icon="content_cut">content_cut</span>
</div>
<div class="text-left">
<span class="block font-title-lg text-title-lg leading-none">Tosa Higiênica</span>
<span class="text-label-md text-on-surface-variant opacity-60">Corte padrão da raça</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant select-icon" data-icon="check_circle">check_circle</span>
</button>
<!-- Activity Item -->
<button class="flex items-center justify-between p-4 rounded-xl glass-card transition-all duration-200 hover:shadow-md group" onclick="toggleService(this)">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:bg-secondary-fixed transition-colors">
<span class="material-symbols-outlined" data-icon="clean_hands">clean_hands</span>
</div>
<div class="text-left">
<span class="block font-title-lg text-title-lg leading-none">Corte de Unhas</span>
<span class="text-label-md text-on-surface-variant opacity-60">Acabamento e lixamento</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant select-icon" data-icon="check_circle">check_circle</span>
</button>
<!-- Activity Item -->
<button class="flex items-center justify-between p-4 rounded-xl glass-card transition-all duration-200 hover:shadow-md group" onclick="toggleService(this)">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:bg-secondary-fixed transition-colors">
<span class="material-symbols-outlined" data-icon="health_and_safety">health_and_safety</span>
</div>
<div class="text-left">
<span class="block font-title-lg text-title-lg leading-none">Limpeza Auricular</span>

</div>
</div>
<span class="material-symbols-outlined text-outline-variant select-icon" data-icon="check_circle">check_circle</span>
</button>
</div>

<!-- Observations Section -->
<section class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="notes">Observações e Detalhes</label>
<div class="relative">
<textarea class="w-full p-4 rounded-xl border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-secondary-container focus:border-secondary font-body-md text-on-surface placeholder:text-outline-variant transition-all outline-none" id="notes" placeholder="Ex: Pet agitado durante o secador, leve vermelhidão na orelha esquerda..." rows="4"></textarea>
<div class="absolute bottom-3 right-3 text-outline-variant pointer-events-none">
<span class="material-symbols-outlined text-[20px]" data-icon="edit_note">edit_note</span>
</div>
</div>
</section>
<!-- Action Section -->
<section class="mt-4">
<button class="w-full py-4 bg-secondary-container text-on-secondary-container font-bold rounded-xl shadow-lg active:scale-95 duration-100 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="task_alt">task_alt</span>
                Finalizar Atividade
            </button>

<span class="material-symbols-outlined" data-icon="search">search</span>

</a>

<span class="material-symbols-outlined" data-icon="assignment" style="font-variation-settings: 'FILL' 1;">assignment</span>
<span class="font-label-sm text-label-sm-mobile">Atividades</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm-mobile">Profile</span>
</a>
</nav>
<script>
        function toggleService(element) {
            const icon = element.querySelector('.select-icon');
            const isSelected = element.classList.contains('active-selection');
            
            if (isSelected) {
                element.classList.remove('active-selection');
                element.classList.remove('ring-2', 'ring-secondary');
                icon.classList.replace('text-on-secondary-container', 'text-outline-variant');
                icon.style.fontVariationSettings = "'FILL' 0";
            } else {
                element.classList.add('active-selection');
                element.classList.add('ring-2', 'ring-secondary');
                icon.classList.replace('text-outline-variant', 'text-on-secondary-container');
                icon.style.fontVariationSettings = "'FILL' 1";
                
                // Haptic-like feedback animation
                element.animate([
                    { transform: 'scale(1)' },
                    { transform: 'scale(0.98)' },
                    { transform: 'scale(1)' }
                ], {
                    duration: 150,
                    easing: 'ease-out'
                });
            }
        }
    </script>
</body></html>
