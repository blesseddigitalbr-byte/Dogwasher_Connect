<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.98)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = '';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = '';
            });
        });

        // Subtle hover light effect following cursor for cards
        const cards = document.querySelectorAll('.premium-card-shadow');
        cards.forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
                card.style.background = `radial-gradient(600px circle at ${x}px ${y}px, rgba(255,255,255,1), rgba(255,255,255,0.85))`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.background = '';
            });
        });
    </script>
